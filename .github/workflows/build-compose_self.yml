name: build-compose_self

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_source:
        description: 'OpenWrt source'
        required: true
        default: immortalwrt/immortalwrt
        type: choice
        options:
        - immortalwrt/immortalwrt
        - MilesPoupart/immortalwrt
      openwrt_branch:
        description: 'OpenWrt branch'
        required: true
        default: 'openwrt-25.12'
        type: choice
        options:
        - 'master'
        - 'openwrt-23.05'
        - 'openwrt-24.10'
        - 'openwrt-25.12'
      compile_device:
        description: 'device'
        required: true
        default: r5c
        type: choice
        options:
        - r2s
        - r5c
      use_machine:
        description: 'Machine'
        required: true
        default: '12900F'
        type: choice
        options:
        - '7700HQ'
        - '12900F'
      compile_version:
        description: 'Version'
        required: true
        default: docker
        type: choice
        options:
        - docker
        - common
      task_setting:
        description: 'Task Settings'
        required: true
        default : 'build-compose'
        type: choice
        options:
        - 'build-compose'
        - 'build-only'
        - 'source-only'
      config_file:
        description: 'Config File'
        required: true
        default: configs/immortal/immortal.config
        type: choice
        options:
        - configs/immortal/merged.config
        - configs/immortal/immortal.config
  # schedule:
  #   - cron: 0 17 * * *
  # watch:
  #   types: started

env:
  REPO_URL: https://github.com/${{ inputs.openwrt_source }}
  CONFIG_FILE: ${{ inputs.config_file }}
  DIY_SH: scripts/immortal.sh
  DIY_DEV_SH: scripts/${{ inputs.compile_device }}.sh
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  IMAGE: milespoupart/action-openwrt-cache:oprk_${{ inputs.compile_device }}_${{ inputs.compile_version }}

jobs:

  DownloadSourceCode:
    runs-on: ubuntu-22.04
    outputs:
      OPENWRTROOT: ${{ steps.update.outputs.OPENWRTROOT }}

    steps:
    - name: Show choice
      run: |
        echo "OpenWrt Source=${{ inputs.openwrt_source }}"
        echo "OpenWrt Branch=${{ inputs.openwrt_branch }}"
        echo "Compile Version=${{ inputs.compile_version }}"
        echo "Task settings=${{ inputs.task_setting }}"
        echo "Compile machine=${{ inputs.use_machine }}"
        echo "Compile device=${{ inputs.compile_device }}"

    - name: Checkout
      if: inputs.task_setting != 'build-only'
      uses: actions/checkout@v6

    - name: Initialization Environment
      if: inputs.task_setting != 'build-only'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT
        echo -e "Total CPU cores\t: $(nproc)"
        cat /proc/cpuinfo | grep 'model name'
        free -h
        uname -a
        [ -f /proc/version ] && cat /proc/version
        [ -f /etc/issue.net ] && cat /etc/issue.net
        [ -f /etc/issue ] && cat /etc/issue
        ulimit -a
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install rdate zstd python3-pyelftools
        # sudo -E apt-get -qq install $(curl -fsSL https://raw.githubusercontent.com/MilesPoupart/openwrt-list/master/depends-ubuntu-2204) tree
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        date
        
    - name: Login to Docker Hub
      if: inputs.task_setting != 'build-only'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}
        
    - name: Clone Source Code
      if: inputs.task_setting != 'build-only'
      run: |
        df -hT $PWD
        git clone -b ${{ inputs.openwrt_branch }} $REPO_URL openwrt
        # cd openwrt

    - name: Apply Download Patch
      if: inputs.task_setting != 'build-only' && inputs.openwrt_branch == 'openwrt-25.12'
      run: |
        cd openwrt
        patch -p1 < ../immortalwrt/001-download-revert-mirror-hash-check.patch
        
    # - name: Reset Version
    #   if: inputs.task_setting != 'build-only'
    #   id: reset
    #   run: |
    #     cd openwrt
    #     echo "OPENWRTROOT=$PWD" >> $GITHUB_ENV
    #     echo "OPENWRTROOT=$PWD" >> $GITHUB_OUTPUT
    #     echo "COMMIT_ID version: $COMMIT_ID"
    #     git reset --hard $COMMIT_ID
    #     rm -rf .git

    - name: Update Feeds
      if: inputs.task_setting != 'build-only'
      id: update
      run: |
        cd openwrt
        echo "OPENWRTROOT=$PWD" >> $GITHUB_ENV
        echo "OPENWRTROOT=$PWD" >> $GITHUB_OUTPUT
        mkdir customfeeds
        git clone --depth=1 -b ${{ inputs.openwrt_branch }} https://github.com/immortalwrt/packages customfeeds/packages
        git clone --depth=1 -b ${{ inputs.openwrt_branch }} https://github.com/immortalwrt/luci customfeeds/luci
        chmod +x ../scripts/*.sh
        ../scripts/feeds_settings.sh

    - name: MOD index file
      if: inputs.task_setting != 'build-only'
      run: |
        cd $OPENWRTROOT/customfeeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include
        sed -i '/_('\''Load Average'\''),/i\\t\t\t_('\''Github'\''),           E('\''a'\'', { '\''href'\'': '\''https://github.com/MilesPoupart/OpenWrt_RockChip'\'' }, [ _('\''固件下载'\'') ]),' 10_system.js

        
    - name: Load Custom Configuration
      if: inputs.task_setting != 'build-only'
      run: |
        [ -e files ] && mv files $OPENWRTROOT/files
        chmod +x scripts/*.sh
        cd $OPENWRTROOT
        ../$DIY_SH
        ../$DIY_DEV_SH
        ../scripts/preset-clash-core.sh arm64
        ../scripts/preset-terminal-tools.sh
        ./scripts/feeds update -a && ./scripts/feeds install -a
        [ -e ../$CONFIG_FILE ] && mv ../$CONFIG_FILE .config
        sed -i '/CONFIG_TARGET_rockchip_armv8=y/a\CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-${{ inputs.compile_device }}=y' .config
        if [ "${{ inputs.compile_version }}" == "docker" ]; then
            echo '
        CONFIG_DOCKER_CGROUP_OPTIONS=y
        CONFIG_DOCKER_NET_MACVLAN=y
        CONFIG_DOCKER_STO_EXT4=y
        CONFIG_PACKAGE_docker=y
        CONFIG_PACKAGE_docker-compose=y
        CONFIG_PACKAGE_dockerd=y
        CONFIG_PACKAGE_luci-app-dockerman=y
        CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y
        CONFIG_PACKAGE_luci-lib-docker=y
        ' >> .config        
        fi
        make defconfig

    - name: Fix LuCI Package Versions (APK Compatibility)
      if: inputs.task_setting != 'build-only' && inputs.openwrt_branch == 'openwrt-25.12'
      run: |
        cd $OPENWRTROOT
        # Fix APK version format incompatibility for LuCI packages
        # APK requires version format: X.Y.Z or X.Y.Z-rN
        # The main version part (before -r) must NOT contain hyphens
        for makefile in $(find package/community -name Makefile -type f); do
          if grep -q "include.*feeds/luci/luci.mk" "$makefile" 2>/dev/null; then
            changed=false

            # Get current PKG_VERSION
            version=$(grep "^PKG_VERSION:=" "$makefile" | head -1 | sed 's/PKG_VERSION:=//' | tr -d ' ')
            
            if [ -n "$version" ]; then
              # Case 1: PKG_VERSION is already X.Y.Z-rN format - VALID, don't touch it
              # e.g., 3.2.0-r5 is valid APK version
              if echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$'; then
                echo "  PKG_VERSION $version is already valid APK format, skipping: $makefile"
              
              # Case 2: PKG_VERSION contains hyphens but NOT in -rN format
              # e.g., 1.0-beta1, 5.8.0-20240106 -> replace hyphens with dots
              elif echo "$version" | grep -q '-'; then
                new_version="${version//-/.}"
                sed -i "s|^PKG_VERSION:=.*|PKG_VERSION:=$new_version|" "$makefile"
                echo "  Fixed PKG_VERSION: $version -> $new_version in $makefile"
                changed=true
              fi
            fi

            # Fix manual $(PKG_VERSION)-$(PKG_RELEASE) -> $(PKG_VERSION)-r$(PKG_RELEASE)
            # luci.mk line 161 already uses -r format, but some custom Makefiles may not
            if grep -q '\$(PKG_VERSION)-\$(PKG_RELEASE)' "$makefile" 2>/dev/null; then
              sed -i 's/\$(PKG_VERSION)-\$(PKG_RELEASE)/$(PKG_VERSION)-r$(PKG_RELEASE)/g' "$makefile"
              echo "  Fixed version concatenation: added -r prefix in $makefile"
              changed=true
            fi

            if [ "$changed" = true ]; then
              echo "Patched: $makefile"
            fi
          fi
        done

    - name: Download Package
      if: inputs.task_setting != 'build-only'
      id: package
      run: |
        cd $OPENWRTROOT
        # cat .config
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c ! -name '*.sha256' -exec rm -f {} \;

    - name: Comporession
      if: inputs.task_setting != 'build-only'
      run: |
        tar --zstd -cf openwrt.tar.zst ./openwrt

    - name: Build and push
      if: inputs.task_setting != 'build-only'
      id: docker_build
      uses: docker/build-push-action@v7
      with:
        context: ./
        file: ./Dockerfile
        push: true
        tags: ${{ env.IMAGE }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
        
    - name: Image digest
      if: inputs.task_setting != 'build-only'
      run: echo ${{ steps.docker_build.outputs.digest }}

  CompileInitialize:
    if: inputs.task_setting != 'source-only'
    runs-on: [self-hosted, Linux, X64, "${{ inputs.use_machine }}"]
    timeout-minutes: 1440
    needs: [DownloadSourceCode]

    outputs:
      OPENWRTROOT: ${{ steps.clean.outputs.OPENWRTROOT }}
      SOURCE_SHA: ${{ steps.image_meta.outputs.SOURCE_SHA }}

    steps:

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo -e "Total CPU cores\t: $(nproc)"
        cat /proc/cpuinfo | grep 'model name'
        free -h
        uname -a
        [ -f /proc/version ] && cat /proc/version
        [ -f /etc/issue.net ] && cat /etc/issue.net
        [ -f /etc/issue ] && cat /etc/issue
        ulimit -a

    - name: Checkout
      uses: actions/checkout@v6
      
    - name: Pull Image
      run: |
        docker pull $IMAGE
        docker images

    - name: Read source commit from image label
      id: image_meta
      run: |
        SOURCE_SHA=$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")
        if [ -z "$SOURCE_SHA" ] || [ "$SOURCE_SHA" = "<no value>" ]; then
          echo "No source commit label found, falling back to github.sha"
          SOURCE_SHA="${{ github.sha }}"
        fi
        echo "SOURCE_SHA=$SOURCE_SHA" >> $GITHUB_OUTPUT
        echo "Source commit: $SOURCE_SHA"
    
    - name: Copy Files
      id: copy
      run: |
        if [[ -f openwrt.tar.zst ]]; then
            rm openwrt.tar.zst
        fi
        ID="$(docker create --name openwrt "$IMAGE")"
        docker cp $ID:/openwrt/openwrt.tar.zst ./openwrt.tar.zst
        docker rm $ID
        docker ps -a
        ls -alh

    - name: Decompression
      run: | 
        if [[ -d openwrt ]]; then
            rm -rf ./openwrt
        fi
        tar -xf openwrt.tar.zst
        ls -alh ./openwrt
        rm openwrt.tar.zst

    - name: Show DLL
      run:  ls -lah ./openwrt/dl

    - name: Clean
      id: clean
      run: |
        cd openwrt
        echo "OPENWRTROOT=$PWD" >> $GITHUB_ENV
        echo "OPENWRTROOT=$PWD" >> $GITHUB_OUTPUT
        rm -rf ./tmp && rm -rf ./build_dir
    
    - name: Feeds Settings
      run: | 
        cd $OPENWRTROOT
        chmod +x ../scripts/*.sh
        ../scripts/feeds_settings.sh
        make defconfig

    - name: Show config
      run: |
        cd $OPENWRTROOT
        cat .config

  CompileToolchain:
    runs-on: [self-hosted, Linux, X64, "${{ inputs.use_machine }}"]
    timeout-minutes: 1440
    needs: [CompileInitialize]

    steps:
    - name: Compile toolchain
      id: compile
      run: | 
        cd ${{ needs.CompileInitialize.outputs.OPENWRTROOT }}
        echo -e "$(nproc) thread compile"
        make tools/compile -j$(nproc) || make tools/compile -j1 V=s
        make toolchain/compile -j$(nproc) || make toolchain/compile -j1 V=s
        make target/compile -j$(nproc) || make target/compile -j1 V=s IGNORE_ERRORS=1
        make diffconfig
  
  CompileFirmware:
    runs-on: [self-hosted, Linux, X64, "${{ inputs.use_machine }}"]
    timeout-minutes: 1440
    needs: [CompileInitialize, CompileToolchain]

    outputs:
      OPENWRTROOT: ${{ steps.compile.outputs.OPENWRTROOT }}
      PLATFORM: ${{ steps.compile.outputs.PLATFORM }}
      TARGET: ${{ steps.compile.outputs.TARGET }}
      SUBTARGET: ${{ steps.compile.outputs.SUBTARGET }}
      FIRMWARE: ${{ steps.compile.outputs.FIRMWARE }}
      GENERATE_STATUS: ${{ steps.generate.outputs.GENERATE_STATUS }}
      RELEASE_DATE: ${{ steps.tag.outputs.RELEASE_DATE }}
      RELEASE_TAG: ${{ steps.tag.outputs.RELEASE_TAG }}
      RELEASE_STATUS: ${{ steps.tag.outputs.RELEASE_STATUS }}
      KERNEL_VERSION: ${{ steps.generate.outputs.KERNEL_VERSION }}
      SOURCE_SHA: ${{ needs.CompileInitialize.outputs.SOURCE_SHA }}

    steps:

    - name: Compile package
      id: compile
      run: |
        cd ${{ needs.CompileInitialize.outputs.OPENWRTROOT }}
        OPENWRTROOT=$(pwd)
        echo "OPENWRTROOT=$OPENWRTROOT" >> $GITHUB_ENV
        echo "OPENWRTROOT=$OPENWRTROOT" >> $GITHUB_OUTPUT
        echo -e "$(nproc) thread compile"
        make package/compile -j$(nproc) IGNORE_ERRORS=1 || make package/compile -j1 V=s IGNORE_ERRORS=1
        make package/index
        cd $OPENWRTROOT/bin/packages/*
        PLATFORM=$(basename `pwd`)
        echo "PLATFORM=$PLATFORM" >> $GITHUB_ENV
        echo "PLATFORM=$PLATFORM" >> $GITHUB_OUTPUT
        cd $OPENWRTROOT/bin/targets/*
        TARGET=$(basename `pwd`)
        echo "TARGET=$TARGET" >> $GITHUB_ENV
        echo "TARGET=$TARGET" >> $GITHUB_OUTPUT
        cd *
        SUBTARGET=$(basename `pwd`)
        echo "SUBTARGET=$SUBTARGET" >> $GITHUB_ENV
        echo "SUBTARGET=$SUBTARGET" >> $GITHUB_OUTPUT
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "FIRMWARE=$PWD" >> $GITHUB_OUTPUT
        echo "COMPILE_STATUS=success" >> $GITHUB_OUTPUT

    - name: Generate Firmware
      if: steps.compile.outputs.COMPILE_STATUS == 'success'
      id: generate
      run: |
        cd configs/opkg
        sed -i "s/subtarget/$SUBTARGET/g" distfeeds*.conf
        sed -i "s/target\//$TARGET\//g" distfeeds*.conf
        sed -i "s/platform/$PLATFORM/g" distfeeds*.conf
        cd $OPENWRTROOT
        mkdir -p files/etc/uci-defaults/
        cp ../scripts/init-settings.sh files/etc/uci-defaults/99-init-settings
        make package/install -j$(nproc) || make package/install -j1 V=s
        make target/install -j$(nproc) || make target/install -j1 V=s
        pushd bin/targets/rockchip/armv8
        kernelv=`cat immortalwrt-rockchip-armv8-friendlyarm_nanopi-${{ inputs.compile_device }}.manifest | grep 'kernel - ' | sed -n 's/kernel - \([0-9.]*\).*/\1/p'`
        echo "KERNEL_VERSION=$kernelv" >> $GITHUB_OUTPUT
        mv immortalwrt-rockchip-armv8-friendlyarm_nanopi-${{ inputs.compile_device }}.manifest ${{ inputs.compile_version }}-immortalwrt-rockchip-armv8-friendlyarm_nanopi-${{ inputs.compile_device }}.manifest
        # rm -rf immortalwrt-rockchip-armv8-friendlyarm_nanopi-${{ inputs.compile_device }}-rootfs.tar.gz
        mv config.buildinfo ${{ inputs.compile_device }}-${{ inputs.compile_version }}-config.buildinfo
        mv immortalwrt-rockchip-armv8-friendlyarm_nanopi-${{ inputs.compile_device }}-ext4-sysupgrade.img.gz ${{ inputs.compile_version }}-friendlyarm_nanopi-${{ inputs.compile_device }}-ext4-sysupgrade.img.gz
        mv immortalwrt-rockchip-armv8-friendlyarm_nanopi-${{ inputs.compile_device }}-squashfs-sysupgrade.img.gz ${{ inputs.compile_version }}-friendlyarm_nanopi-${{ inputs.compile_device }}-squashfs-sysupgrade.img.gz
        popd
        mkdir -p server/web/snapshots/targets/$TARGET/$SUBTARGET
        cp -r $OPENWRTROOT/bin/packages server/web/snapshots
        cp -r $OPENWRTROOT/bin/targets/$TARGET/$SUBTARGET/packages server/web/snapshots/targets/$TARGET/$SUBTARGET
        mv server packages-server
        zip -qrm ${{ inputs.compile_device }}-${{ inputs.compile_version }}-packages-server.zip packages-server
        mv ${{ inputs.compile_device }}-${{ inputs.compile_version }}-packages-server.zip $OPENWRTROOT/bin/targets/$TARGET/$SUBTARGET
        make checksum
        mv bin/targets/rockchip/armv8/sha256sums bin/targets/rockchip/armv8/${{ inputs.compile_device }}-${{ inputs.compile_version }}-sha256sums
        echo "GENERATE_STATUS=success" >> $GITHUB_OUTPUT

        
    - name: Generate release tag
      id: tag
      if: steps.generate.outputs.GENERATE_STATUS == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
          echo "RELEASE_TAG=$(date +"%Y.%m.%d")-immortalwrt-${{ inputs.compile_device }}" >> $GITHUB_OUTPUT
          echo "RELEASE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "本次编译的openwrt源：${{ inputs.openwrt_source }}
                后台地址：192.168.2.1(r2s)/192.168.3.1(r5c)
                common/docker = 无docker/有docker" >> release.txt
          echo "RELEASE_STATUS=success" >> $GITHUB_OUTPUT

  UploadFirmware:
    runs-on: [self-hosted, Linux, X64, "${{ inputs.use_machine }}"]
    timeout-minutes: 1440
    needs: [CompileFirmware]

    steps:
  
    - name: Remove Images
      if: env.UPLOAD_RELEASE == 'true' && !cancelled() && needs.CompileFirmware.outputs.RELEASE_STATUS == 'success'
      run: | 
        ID_LIST="$(docker images -q)"
        if [[ -n "${ID_LIST}" ]];then
           docker rmi $ID_LIST -f
        fi
        docker images

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: needs.CompileFirmware.outputs.RELEASE_STATUS == 'success' && !cancelled() && env.UPLOAD_RELEASE == 'true'
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          name: ${{ needs.CompileFirmware.outputs.RELEASE_DATE }} NanoPi-${{ inputs.compile_device }}-linux-${{ needs.CompileFirmware.outputs.KERNEL_VERSION }} 固件
          tag_name: ${{ needs.CompileFirmware.outputs.RELEASE_TAG }}
          target_commitish: ${{ needs.CompileFirmware.outputs.SOURCE_SHA }}
          body_path: release.txt
          files: ${{ needs.CompileFirmware.outputs.FIRMWARE }}/*

    - name: Delete releases and workflow runs
      uses: ophub/delete-releases-workflows@main
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        delete_releases: true
        releases_keep_latest: 20
        delete_tags: true
        delete_workflows: true
        workflows_keep_day: 1
        gh_token: ${{ secrets.GITHUB_TOKEN }}
